services:
  - type: web
    name: blaze-messenger
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: blaze-db
          property: connectionString

databases:
  - name: blaze-db
    plan: free
    databaseName: blaze
    user: blaze