let recordTouchStartY = 0;
micBtn.addEventListener("touchstart", startVoiceRecording, { passive: true });
micBtn.addEventListener("mousedown", startVoiceRecording);
micBtn.addEventListener("touchend", stopVoiceRecording);
micBtn.addEventListener("mouseup", stopVoiceRecording);
micBtn.addEventListener("touchmove", (e) => {
  if (!state.isRecording) return;
  const dy = recordTouchStartY - e.touches[0].clientY;
  if (dy > 60) state.recordCanceled = true;
}, { passive: true });

async function startVoiceRecording(e) {
  if (state.isRecording) return;
  if (e && e.touches) recordTouchStartY = e.touches[0].clientY;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { showToast("Запись не поддерживается"); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    state.recordedChunks = [];
    state.recordCanceled = false;
    state.recordStartTime = Date.now();
    state.isRecording = true;
    const mimeType = MediaRecorder.isTypeSupported("audio/webm;codecs=opus") ? "audio/webm;codecs=opus" : (MediaRecorder.isTypeSupported("audio/webm") ? "audio/webm" : "");
    const options = mimeType ? { mimeType } : {};
    state.mediaRecorder = new MediaRecorder(stream, options);
    state.mediaRecorder.ondataavailable = (event) => { if (event.data && event.data.size > 0) state.recordedChunks.push(event.data); };
    state.mediaRecorder.onstop = () => { stream.getTracks().forEach(track => track.stop()); finalizeVoiceRecording(); };
    state.mediaRecorder.start();
    micBtn.classList.add("recording");
    micBtn.textContent = "⏺";
    showRecordingUI();
    state.recordTimer = setInterval(() => {
      const elapsed = Math.floor((Date.now() - state.recordStartTime) / 1000);
      const timer = $("rec-timer");
      if (timer) timer.textContent = formatDuration(elapsed);
      if (elapsed >= 60) stopVoiceRecording();
    }, 200);
  } catch (err) {
    console.error("Mic error:", err);
    showToast(t("no_mic"));
    state.isRecording = false;
  }
}

function showRecordingUI() {
  let el = $("recording-panel");
  if (el) el.remove();
  el = document.createElement("div");
  el.id = "recording-panel";
  el.className = "voice-recording";
  el.style.cssText = `position:absolute;bottom:70px;left:12px;right:12px;background:var(--bg-2);border-radius:22px;padding:8px 16px;border:1px solid var(--red);z-index:50;box-shadow:0 4px 20px rgba(255,80,64,0.3);`;
  el.innerHTML = `
    <div class="voice-rec-dot"></div>
    <div class="voice-rec-timer" id="rec-timer">0:00</div>
    <div class="voice-rec-hint" id="rec-hint">${t("release_to_send")}</div>
    <button class="voice-rec-cancel" id="rec-cancel">✕</button>
  `;
  $("chat-screen").appendChild(el);
  $("rec-cancel").onclick = () => { state.recordCanceled = true; stopVoiceRecording(); };
}

function stopVoiceRecording() {
  if (!state.isRecording || !state.mediaRecorder) return;
  state.isRecording = false;
  clearInterval(state.recordTimer);
  micBtn.classList.remove("recording");
  micBtn.textContent = "🎤";
  updateSendMicButtons();
  try { state.mediaRecorder.stop(); } catch (e) { console.error(e); finalizeVoiceRecording(); }
}

async function finalizeVoiceRecording() {
  const panel = $("recording-panel");
  if (panel) panel.remove();
  if (state.recordCanceled) { state.recordedChunks = []; return; }
  const duration = Math.floor((Date.now() - state.recordStartTime) / 1000);
  if (duration < 1) { state.recordedChunks = []; return; }
  if (state.recordedChunks.length === 0) return;
  const blob = new Blob(state.recordedChunks, { type: "audio/webm" });
  if (blob.size > 2 * 1024 * 1024) { alert(t("max_voice_2mb")); state.recordedChunks = []; return; }
  const reader = new FileReader();
  reader.onload = () => {
    const base64 = reader.result.split(",")[1];
    wsSend({ type: "message", chat_id: state.currentChatId, msg_type: "voice", text: null, file_data: base64, file_name: `voice_${Date.now()}.webm`, file_type: "audio/webm", duration });
  };
  reader.readAsDataURL(blob);
  state.recordedChunks = [];
}

// ===== ОГОНЁК (canvas-подход с переключением камер) =====
async function startCircleRecording() {
  if (state.circleIsRecording) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showToast("Камера не поддерживается");
    return;
  }
  try {
    // 1. Получаем видео-поток с камеры
    state.circleSourceStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: state.circleFacingMode, width: 480, height: 480 },
      audio: true,
    });

    // 2. Подключаем к скрытому video
    const srcVideo = $("circle-source-video");
    srcVideo.srcObject = state.circleSourceStream;
    await srcVideo.play().catch(() => {});

    // 3. Canvas рисует видео
    const canvas = $("circle-canvas");
    const ctx = canvas.getContext("2d");

    // 4. Отдельный поток с canvas + аудио из исходного
    const canvasStream = canvas.captureStream(30);
    const audioTracks = state.circleSourceStream.getAudioTracks();
    if (audioTracks.length > 0) {
      canvasStream.addTrack(audioTracks[0]);
    }
    state.circleCanvasStream = canvasStream;

    // 5. Запускаем рисование видео на canvas
    state.circleCanvasInterval = setInterval(() => {
      if (!canvas || !srcVideo) return;
      ctx.save();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      // Зеркалим для фронталки
      if (state.circleFacingMode === "user") {
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
      }
      ctx.drawImage(srcVideo, 0, 0, canvas.width, canvas.height);
      ctx.restore();
    }, 33); // ~30fps

    // 6. Запускаем recorder на canvas-потоке
    state.circleChunks = [];
    state.circleStartTime = Date.now();
    state.circleIsRecording = true;

    const mimeType = MediaRecorder.isTypeSupported("video/webm;codecs=vp9,opus")
      ? "video/webm;codecs=vp9,opus"
      : (MediaRecorder.isTypeSupported("video/webm") ? "video/webm" : "");

    state.circleRecorder = new MediaRecorder(canvasStream, mimeType ? { mimeType } : {});
    state.circleRecorder.ondataavailable = (e) => {
      if (e.data && e.data.size > 0) state.circleChunks.push(e.data);
    };
    state.circleRecorder.onstop = () => { finalizeCircleRecording(); };
    state.circleRecorder.start();

    showCircleRecordingUI();

    state.circleTimer = setInterval(() => {
      const elapsed = Math.floor((Date.now() - state.circleStartTime) / 1000);
      const timerEl = $("circle-timer");
      if (timerEl) timerEl.textContent = formatDuration(elapsed);
      if (elapsed >= 60) stopCircleRecording();
    }, 200);

  } catch (err) {
    console.error("Circle record error:", err);
    showToast(t("no_camera"));
    state.circleIsRecording = false;
    cleanupCircle();
  }
}

function showCircleRecordingUI() {
  const modal = document.createElement("div");
  modal.className = "modal-overlay active";
  modal.id = "circle-modal";
  modal.innerHTML = `
    <div class="modal circle-modal-content">
      <div class="circle-rec-wrapper">
        <video class="circle-preview-video" id="circle-preview" autoplay muted playsinline></video>
        <div class="circle-flame-badge">🔥</div>
        <button class="circle-flip-btn" id="circle-flip" title="Flip">🔄</button>
        <div class="circle-timer" id="circle-timer">0:00</div>
      </div>
      <div class="circle-actions">
        <button class="btn-secondary" id="circle-cancel">${t("cancel")}</button>
        <button class="primary-btn" id="circle-send">🔥 ${t("send")}</button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);

  // Превью — берём из того же srcVideo через canvas-подход, но для показа просто srcObject
  $("circle-preview").srcObject = state.circleSourceStream;

  // Переворот камеры — БЕЗ остановки записи!
  $("circle-flip").onclick = async () => {
    try {
      $("circle-flip").style.transform = "rotate(180deg) scale(0.9)";
      setTimeout(() => { $("circle-flip").style.transform = ""; }, 200);

      // Меняем направление
      state.circleFacingMode = state.circleFacingMode === "user" ? "environment" : "user";

      // Стопаем старый видео-трек
      if (state.circleSourceStream) {
        state.circleSourceStream.getVideoTracks().forEach(t => t.stop());
      }

      // Получаем новую камеру
      const newStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: state.circleFacingMode, width: 480, height: 480 },
        audio: false,
      });

      // Меняем видео-трек в основном потоке
      const newVideoTrack = newStream.getVideoTracks()[0];
      const oldVideoTrack = state.circleSourceStream.getVideoTracks()[0];
      if (oldVideoTrack) state.circleSourceStream.removeTrack(oldVideoTrack);
      state.circleSourceStream.addTrack(newVideoTrack);

      // Обновляем скрытое video
      const srcVideo = $("circle-source-video");
      srcVideo.srcObject = state.circleSourceStream;
      await srcVideo.play().catch(() => {});

      // Обновляем превью в модалке (тоже через srcObject на video)
      $("circle-preview").srcObject = state.circleSourceStream;

      showToast("🔄 Камера перевёрнута");
    } catch (err) {
      console.error("Flip error:", err);
      showToast("Не удалось перевернуть");
    }
  };

  $("circle-cancel").onclick = () => {
    state.circleChunks = [];
    stopCircleRecording();
    modal.remove();
  };

  $("circle-send").onclick = () => {
    stopCircleRecording();
    modal.remove();
  };
}

function stopCircleRecording() {
  if (state.circleTimer) clearInterval(state.circleTimer);
  state.circleTimer = null;
  state.circleIsRecording = false;
  if (state.circleRecorder && state.circleRecorder.state !== "inactive") {
    state.circleRecorder.stop();
  }
  if (state.circleCanvasInterval) {
    clearInterval(state.circleCanvasInterval);
    state.circleCanvasInterval = null;
  }
  if (state.circleSourceStream) {
    state.circleSourceStream.getTracks().forEach(t => t.stop());
    state.circleSourceStream = null;
  }
  if (state.circleCanvasStream) {
    state.circleCanvasStream.getTracks().forEach(t => t.stop());
    state.circleCanvasStream = null;
  }
}

function cleanupCircle() {
  if (state.circleTimer) clearInterval(state.circleTimer);
  state.circleTimer = null;
  if (state.circleCanvasInterval) clearInterval(state.circleCanvasInterval);
  state.circleCanvasInterval = null;
  if (state.circleSourceStream) {
    state.circleSourceStream.getTracks().forEach(t => t.stop());
    state.circleSourceStream = null;
  }
  if (state.circleCanvasStream) {
    state.circleCanvasStream.getTracks().forEach(t => t.stop());
    state.circleCanvasStream = null;
  }
}

function finalizeCircleRecording() {
  if (state.circleChunks.length === 0) return;
  const duration = Math.floor((Date.now() - state.circleStartTime) / 1000);
  if (duration < 1) { state.circleChunks = []; return; }
  const blob = new Blob(state.circleChunks, { type: "video/webm" });
  if (blob.size > 8 * 1024 * 1024) { alert("Огонёк слишком большой (макс 8 МБ)"); state.circleChunks = []; return; }
  const reader = new FileReader();
  reader.onload = () => {
    const base64 = reader.result.split(",")[1];
    wsSend({
      type: "message", chat_id: state.currentChatId, msg_type: "circle", text: null,
      file_data: base64, file_name: `circle_${Date.now()}.webm`,
      file_type: "video/webm", duration,
    });
  };
  reader.readAsDataURL(blob);
  state.circleChunks = [];
}

  `;
  $("profile-screen").classList.add("active");
  $("profile-title").textContent = t("my_profile");

  $("my-avatar").onclick = () => $("avatar-input").click();
  $("avatar-input").onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 1024 * 1024) { alert("Аватар макс 1 МБ"); return; }
    const reader = new FileReader();
    reader.onload = () => {
      const base64 = reader.result.split(",")[1];
      wsSend({ type: "update_profile", avatar_data: base64 });
      state.currentUser.avatar_data = base64;
      localStorage.setItem("blaze_user", JSON.stringify(state.currentUser));
      $("my-avatar").innerHTML = `<img src="data:image/jpeg;base64,${base64}" alt=""><div class="avatar-edit-hint">Изменить</div>`;
      updateSideMenu();
    };
    reader.readAsDataURL(file);
    e.target.value = "";
  };

  $("profile-save").onclick = () => {
    const dn = $("profile-display-name").value.trim();
    const newUsername = $("profile-username-input").value.trim().toLowerCase().replace(/^@/, "");
    const bio = $("profile-bio").value.trim();

    if (!dn) { alert("Имя не может быть пустым"); return; }

    // Валидация username если изменился
    if (newUsername !== state.currentUser.username) {
      if (newUsername.length < 3) { alert(t("username_min")); return; }
      if (!/^[a-z0-9_]+$/.test(newUsername)) { alert(t("username_invalid")); return; }
      wsSend({ type: "update_profile", new_username: newUsername });
    }

    wsSend({ type: "update_profile", display_name: dn, bio: bio });
  };

  $("profile-logout").onclick = () => { $("profile-screen").classList.remove("active"); $("side-logout").click(); };
}

// ===== УВЕДОМЛЕНИЯ =====
async function initNotifications() {
  if (!("Notification" in window)) { state.notificationsEnabled = false; updateSideBadges(); return; }
  if (Notification.permission === "default") {
    try {
      const perm = await Notification.requestPermission();
      state.notificationsEnabled = perm === "granted";
    } catch (e) { state.notificationsEnabled = false; }
  } else if (Notification.permission === "granted") {
    state.notificationsEnabled = true;
  } else {
    state.notificationsEnabled = false;
  }
  updateSideBadges();
}

async function requestNotificationPermission() {
  if (!("Notification" in window)) { showToast("Уведомления не поддерживаются"); return; }
  if (Notification.permission === "granted") {
    state.notificationsEnabled = !state.notificationsEnabled;
    showToast(state.notificationsEnabled ? "Уведомления включены" : "Уведомления выключены");
    updateSideBadges();
    return;
  }
  const perm = await Notification.requestPermission();
  state.notificationsEnabled = perm === "granted";
  updateSideBadges();
}

function showNotification(m) {
  if (!state.notificationsEnabled) return;
  if (document.visibilityState === "visible") return;
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  let body = m.text || "";
  if (m.msg_type === "voice") body = "🎤 Голосовое";
  else if (m.msg_type === "circle") body = "🔥 Огонёк";
  else if (m.msg_type === "image") body = "🖼️ Фото";
  else if (m.msg_type === "video") body = "📹 Видео";
  else if (m.msg_type === "file") body = "📎 Файл";
  try {
    const notif = new Notification(m.nickname || "Blaze", {
      body: body,
      tag: "blaze-" + m.chat_id,
    });
    notif.onclick = () => {
      window.focus();
      const chat = state.myChats.find(c => c.id === m.chat_id);
      if (chat) openChat(chat);
      notif.close();
    };
  } catch (e) { console.error("Notification error:", e); }
}

async function startCall(peer, callType) {
  if (state.callActive) { showToast("Уже есть активный звонок"); return; }
  if (!peer.id) { showToast("Нельзя позвонить"); return; }
  state.callActive = true;

  state.callPeerId = peer.id;
  state.callPeerName = peer.display_name || peer.username;
  state.isVideoOn = callType === "video";
  showCallScreen(peer);
  setCallStatus(t("calling"));
  try {
    const constraints = callType === "video" ? { audio: true, video: { facingMode: "user" } } : { audio: true, video: false };
    state.callLocalStream = await navigator.mediaDevices.getUserMedia(constraints);
    if (callType === "video") {
      $("call-video-local").srcObject = state.callLocalStream;
      $("call-video-container").style.display = "block";
    }
    state.callPc = createPeerConnection();
    state.callLocalStream.getTracks().forEach(track => state.callPc.addTrack(track, state.callLocalStream));
    const offer = await state.callPc.createOffer();
    await state.callPc.setLocalDescription(offer);
    wsSend({ type: "call_offer", target_id: peer.id, sdp: offer.sdp, call_type: callType });
  } catch (err) { console.error(err); showToast(t("no_camera")); endCall(true); }
}

function createPeerConnection() {
  const pc = new RTCPeerConnection(ICE_SERVERS);
  pc.onicecandidate = (event) => { if (event.candidate) wsSend({ type: "call_ice", target_id: state.callPeerId, candidate: event.candidate.toJSON() }); };
  pc.ontrack = (event) => {
    state.callRemoteStream = event.streams[0];
    $("call-video-remote").srcObject = event.streams[0];
    $("call-video-container").style.display = "block";
    if (state.callType === "video") $("call-video-remote").style.display = "block";
    startCallTimer();
  };
  pc.onconnectionstatechange = () => { if (["disconnected","failed","closed"].includes(pc.connectionState)) { if (state.callActive) endCall(true); } };
  return pc;
}

function showCallScreen(peer) {
  const name = peer.display_name || peer.username;
  const color = peer.color || colorFromName(name);
  $("call-name").textContent = name;
  const av = $("call-avatar");
  av.style.background = color;
  av.textContent = initial(name);
  if (peer.avatar_data) av.innerHTML = `<img src="data:image/jpeg;base64,${peer.avatar_data}" alt="">`;
  $("call-screen").classList.add("active");
  $("call-video-remote").style.display = state.callType === "video" ? "block" : "none";
  $("call-video-local").style.display = state.callType === "video" ? "block" : "none";
  $("call-video-container").style.display = state.callType === "video" ? "block" : "none";
}
function setCallStatus(text) { $("call-status").textContent = text; }
function startCallTimer() {
  state.callStartTime = Date.now();
  clearInterval(state.callTimer);
  state.callTimer = setInterval(() => { setCallStatus(formatDuration(Math.floor((Date.now() - state.callStartTime) / 1000))); }, 1000);
}

async function handleIncomingCall(m) {
  if (state.callActive) { wsSend({ type: "call_busy", target_id: m.from_id }); return; }
  state.incomingCallData = m;
  $("incoming-call-name").textContent = m.from_name || "—";
  $("incoming-call-type").textContent = m.call_type === "video" ? t("incoming_video_call") : t("incoming_call");
  $("incoming-call").classList.add("show");
  clearTimeout(state._incomingTimer);
  state._incomingTimer = setTimeout(() => { if (state.incomingCallData) declineIncomingCall(); }, 60000);
}

async function acceptIncomingCall() {
  const m = state.incomingCallData;
  if (!m) return;
  $("incoming-call").classList.remove("show");
  clearTimeout(state._incomingTimer);
  state.callActive = true;
  state.callType = m.call_type;
  state.callPeerId = m.from_id;
  state.callPeerName = m.from_name;
  state.isVideoOn = m.call_type === "video";
  showCallScreen({ display_name: m.from_name, color: colorFromName(m.from_name) });
  setCallStatus("Connecting...");
  try {
    const constraints = m.call_type === "video" ? { audio: true, video: { facingMode: "user" } } : { audio: true, video: false };
    state.callLocalStream = await navigator.mediaDevices.getUserMedia(constraints);
    if (m.call_type === "video") $("call-video-local").srcObject = state.callLocalStream;
    state.callPc = createPeerConnection();
    state.callLocalStream.getTracks().forEach(track => state.callPc.addTrack(track, state.callLocalStream));
    await state.callPc.setRemoteDescription({ type: "offer", sdp: m.sdp });
    const answer = await state.callPc.createAnswer();
    await state.callPc.setLocalDescription(answer);
    wsSend({ type: "call_answer", target_id: m.from_id, sdp: answer.sdp });
    state.incomingCallData = null;
  } catch (err) { console.error(err); showToast(t("no_camera")); endCall(true); }
}

function declineIncomingCall() {
  const m = state.incomingCallData;
  if (m) wsSend({ type: "call_reject", target_id: m.from_id });
  $("incoming-call").classList.remove("show");
  clearTimeout(state._incomingTimer);
  state.incomingCallData = null;
}

async function handleCallAnswer(m) { if (state.callPc) try { await state.callPc.setRemoteDescription({ type: "answer", sdp: m.sdp }); } catch (e) {} }
async function handleCallIce(m) { if (state.callPc && m.candidate) try { await state.callPc.addIceCandidate(m.candidate); } catch (e) {} }
function handleRemoteCallEnd(m) { if (state.callActive) { setCallStatus(t("call_ended")); setTimeout(() => endCall(true), 800); } }
function handleCallRejected(m) { if (state.callActive) { setCallStatus(t("call_declined")); setTimeout(() => endCall(true), 800); } }
function handleCallBusy(m) { if (state.callActive) { setCallStatus(t("call_busy")); setTimeout(() => endCall(true), 800); } }

function endCall(local = false) {
  if (!local && state.callPeerId) wsSend({ type: "call_end", target_id: state.callPeerId });
  if (state.callPc) try { state.callPc.close(); } catch (e) {}
  if (state.callLocalStream) state.callLocalStream.getTracks().forEach(t => t.stop());
  state.callPc = null; state.callLocalStream = null; state.callRemoteStream = null;
  state.callActive = false; state.callPeerId = null; state.callType = null;
  clearInterval(state.callTimer); state.callTimer = null;
  $("call-video-remote").srcObject = null;
  $("call-video-local").srcObject = null;
  $("call-screen").classList.remove("active");
  $("call-video-container").style.display = "none";
}

$("call-end").onclick = () => { setCallStatus(t("call_ended")); setTimeout(() => endCall(false), 300); };
$("call-mute").onclick = () => { if (!state.callLocalStream) return; state.isMuted = !state.isMuted; state.callLocalStream.getAudioTracks().forEach(t => t.enabled = !state.isMuted); $("call-mute").classList.toggle("active", state.isMuted); };
$("call-video-toggle").onclick = () => { if (!state.callLocalStream) return; state.isVideoOn = !state.isVideoOn; state.callLocalStream.getVideoTracks().forEach(t => t.enabled = state.isVideoOn); $("call-video-toggle").classList.toggle("active", !state.isVideoOn); };
$("call-speaker").onclick = () => $("call-speaker").classList.toggle("active");
$("call-camera-flip").onclick = async () => {
  if (!state.callLocalStream || state.callType !== "video") return;
  const track = state.callLocalStream.getVideoTracks()[0];
  if (!track) return;
  const newFacing = (track.getSettings().facingMode === "user") ? "environment" : "user";
  try {
    const ns = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: newFacing } });
    const nt = ns.getVideoTracks()[0];
    const sender = state.callPc.getSenders().find(s => s.track && s.track.kind === "video");
    if (sender) await sender.replaceTrack(nt);
    track.stop();
    state.callLocalStream.removeTrack(track);
    state.callLocalStream.addTrack(nt);
    $("call-video-local").srcObject = state.callLocalStream;
  } catch (e) { console.error(e); }
};
$("incoming-accept").onclick = acceptIncomingCall;
$("incoming-decline").onclick = declineIncomingCall;
$("voice-call-btn").onclick = () => {
  if (!state.currentChatInfo || state.currentChatInfo.type !== "private") { showToast("Только в личных чатах"); return; }
  startCall({ id: state.currentChatInfo.other_id, username: state.currentChatInfo.other_name, display_name: state.currentChatInfo.other_name, color: state.currentChatInfo.other_color, avatar_data: state.currentChatInfo.other_avatar }, "voice");
};
$("video-call-btn").onclick = () => {
  if (!state.currentChatInfo || state.currentChatInfo.type !== "private") { showToast("Только в личных чатах"); return; }
  startCall({ id: state.currentChatInfo.other_id, username: state.currentChatInfo.other_name, display_name: state.currentChatInfo.other_name, color: state.currentChatInfo.other_color, avatar_data: state.currentChatInfo.other_avatar }, "video");
};

//  НАЧАЛО ЧАСТИ 15/15 — Свайпы, автовход, инициализация (ФИНАЛ)
// ============================================================

// ===== СВАЙП ОТ КРАЯ =====
document.addEventListener("touchstart", (e) => {
  if (!state.currentUser) return;
  if ($("profile-screen").classList.contains("active") || $("call-screen").classList.contains("active")) return;
  if (e.touches[0].clientX < 30) {
    state.edgeSwipeStartX = e.touches[0].clientX;
    state.edgeSwipeActive = true;
  }
}, { passive: true });

document.addEventListener("touchmove", (e) => {
  if (!state.edgeSwipeActive) return;
  const dx = e.touches[0].clientX - state.edgeSwipeStartX;
  if (dx > 60) {
    $("side-menu").classList.add("open");
    $("overlay").classList.add("show");
    state.edgeSwipeActive = false;
  }
}, { passive: true });

document.addEventListener("touchend", () => { state.edgeSwipeActive = false; });

// ===== ТЕМА =====
$("theme-toggle-chats").onclick = toggleTheme;
$("theme-toggle-chat").onclick = toggleTheme;

// ===== KEYBOARD =====
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    if ($("profile-screen").classList.contains("active")) $("profile-screen").classList.remove("active");
    else if ($("search-users-screen").classList.contains("active")) $("search-users-screen").classList.remove("active");
    else if ($("viewer").classList.contains("active")) { $("viewer").classList.remove("active"); $("viewer-content").innerHTML = ""; }
    else if ($("side-menu").classList.contains("open")) { $("side-menu").classList.remove("open"); $("overlay").classList.remove("show"); }
    else closeAllMenus();
  }
});

// ===== ВОЗВРАЩЕНИЕ К ПРИЛОЖЕНИЮ =====
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && state.currentUser) {
    if (!state.ws || state.ws.readyState !== WebSocket.OPEN) {
      const token = localStorage.getItem("blaze_token");
      if (token) connect({ action: "token", token });
    }
  }
});

// ===== PING =====
setInterval(() => {
  if (state.ws && state.ws.readyState === WebSocket.OPEN) {
    state.ws.send(JSON.stringify({ type: "ping" }));
  }
}, 25000);

// ===== АВТОВХОД ПО ТОКЕНУ =====
function tryAutoLogin() {
  const savedToken = localStorage.getItem("blaze_token");
  const savedUser = localStorage.getItem("blaze_user");
  if (!savedToken || !savedUser) return false;
  try {
    const payload = JSON.parse(atob(savedToken.split(".")[1]));
    const now = Math.floor(Date.now() / 1000);
    if (payload.exp && payload.exp > now) {
      console.log("🔑 Автовход по токену");
      try {
        state.currentUser = JSON.parse(savedUser);
        updateSideMenu();
      } catch (e) {}
      $("auth-screen").classList.remove("active");
      $("chats-screen").classList.add("active");
      connect({ action: "token", token: savedToken });
      return true;
    } else {
      localStorage.removeItem("blaze_token");
      localStorage.removeItem("blaze_user");
      return false;
    }
  } catch (e) {
    localStorage.removeItem("blaze_token");
    localStorage.removeItem("blaze_user");
    return false;
  }
}

// ===== ИНИЦИАЛИЗАЦИЯ =====
function init() {
  applyTheme(state.theme);
  applyTranslations();
  updateSideBadges();

  const autoLoggedIn = tryAutoLogin();

  if (!autoLoggedIn) {
    setTimeout(() => {
      if (!state.currentUser) {
        const el = $("login-username");
        if (el) el.focus();
      }
    }, 300);
  }

  console.log("🔥 Blaze Messenger v5.0 загружен");
  console.log("📍 Сервер:", SERVER);
}

window.onerror = (msg, url, line) => {
  console.error("❌ Глобальная ошибка:", msg, "строка", line);
};

init();
